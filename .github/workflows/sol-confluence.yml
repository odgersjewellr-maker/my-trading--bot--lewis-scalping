name: SOL confluence book

# Book 5 — full confluence stack + scale-out exit, run as a FIFTH paper book
# alongside the other 4, not replacing them. Same NKB signal, same SOLUSDT/15m
# cadence as book 2, but requires ADX + regime + RSI + ATR to ALL agree before
# entry (not just ADX+regime like BTCUSDT-DAILY), and banks 70% of the
# position at 1R instead of riding pure trail to the end.
#
# Backtested on 8y of real BTC daily data (see backtest-confluence.mjs and
# backtest-scaleout.mjs): win rate 59.2%->63.5%, PF 1.24->1.38, max drawdown
# 43.7%->29.7%, recent-2-year return 4.4%->22.0% vs the ADX+regime-only
# config. The backtest itself is BTC-only (SOL history isn't in this repo),
# so run this book with that in mind — it's testing whether the same edge
# transfers to SOL, not confirming it already has. Originally ran as
# BTCUSDT-CONFLUENCE (see git history) before being switched to SOL.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-sol-confluence:
    runs-on: ubuntu-latest
    concurrency:
      group: run-bot-SOLUSDT-CONFLUENCE
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install

      - name: Write .env
        run: |
          cat <<EOF > .env
          BITGET_API_KEY=${{ secrets.BITGET_API_KEY }}
          BITGET_SECRET_KEY=${{ secrets.BITGET_SECRET_KEY }}
          BITGET_PASSPHRASE=${{ secrets.BITGET_PASSPHRASE }}
          BITGET_BASE_URL=https://api.bitget.com
          TRADE_MODE=futures
          LEVERAGE=1
          TRADE_SIZE_PCT=80
          PORTFOLIO_VALUE_USD=1000
          MAX_TRADES_PER_DAY=0
          SYMBOL=SOLUSDT
          INSTANCE_ID=SOLUSDT-CONFLUENCE
          TIMEFRAME=15m
          NKB_KERNEL=gaussian
          NKB_BAND_MULT=3.0
          NKB_BANDWIDTH=6.0
          NKB_ATR_STOP_MULT=1.0
          RISK_PCT=5
          ADX_ENTRY_MIN=25
          REGIME_GATE=chop+markov
          RSI_ENTRY_GATE=true
          ATR_EXPANSION_GATE=true
          SCALE_OUT_ENABLED=true
          SCALE_OUT_BANK_FRAC=0.7
          SCALE_OUT_TP_MULT=1.0
          PAPER_TRADING=true
          PAPER_FEE_RATE=0.0008
          EOF

      - name: Run bot
        run: node bot.js

      - name: Persist state back to repo
        run: |
          rm -f .env
          git config user.name "trading-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in position-SOLUSDT-CONFLUENCE.json trades-SOLUSDT-CONFLUENCE.csv safety-check-log-SOLUSDT-CONFLUENCE.json nkb-state-SOLUSDT-CONFLUENCE.json portfolio-SOLUSDT-CONFLUENCE.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "SOL-CONFLUENCE run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i) — rebasing onto latest ${{ github.ref_name }}..."
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }}
            sleep $((i * 2))
          done
          echo "::error::git push failed after retries"
          exit 1
